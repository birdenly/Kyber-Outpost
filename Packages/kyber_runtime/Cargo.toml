[package]
name = "kyber-local-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["std"] }
quick-xml = { version = "0.30.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
log = "0.4"
sha1 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.51.0"
winapi = { version = "0.3.9", features = ["handleapi", "tlhelp32", "processthreadsapi", "winnt", "winerror"] }
