name: Build Outpost CLI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/build-module.yaml

  build:
    needs: module
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: ./.github/actions/setup-frontend
        with:
          rust-workspace: CLI/rust

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Generate shared Dart sources
        run: |
          New-Item -ItemType Directory -Path 'Packages/kyber/lib/gen', 'Launcher/lib/gen/rust', 'CLI/lib/gen' -Force | Out-Null
          dart run melos run generate_proto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run melos run generate

      - name: Generate Rust bridge
        working-directory: CLI
        run: flutter_rust_bridge_codegen generate --no-dart-fix --no-build-runner

      - name: Resolve CLI dependencies and generate models
        working-directory: CLI
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner build

      - name: Build Rust library
        run: cargo build --release --manifest-path CLI/rust/Cargo.toml

      - uses: actions/download-artifact@v8
        with:
          name: outpost-module-windows-x64
          path: CLI/build/windows-x64

      - name: Build portable CLI
        working-directory: CLI
        run: |
          dart compile exe bin/kyber_cli.dart -o build/windows-x64/kyber_cli.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'rust/target/release/rust_lib.dll' -Destination 'build/windows-x64'
          Copy-Item -LiteralPath '../tool/setup_outpost.bat' -Destination 'build/windows-x64'
          Copy-Item -LiteralPath '../tool/allow_lan_firewall.ps1' -Destination 'build/windows-x64'

      - name: Check packaged CLI
        run: ./CLI/build/windows-x64/kyber_cli.exe --help

      - uses: actions/upload-artifact@v7
        with:
          name: outpost-cli-windows-x64
          path: CLI/build/windows-x64/
          if-no-files-found: error
          retention-days: 14
