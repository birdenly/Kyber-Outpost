name: Build Outpost launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-launcher.yml'
      - '.github/workflows/build-module.yaml'
      - '.github/actions/setup-frontend/**'
      - 'Launcher/**'
      - 'Module/**'
      - 'Packages/**'
      - 'pubspec.yaml'
      - 'tool/**'
  pull_request:
    paths:
      - '.github/workflows/build-launcher.yml'
      - '.github/workflows/build-module.yaml'
      - '.github/actions/setup-frontend/**'
      - 'Launcher/**'
      - 'Module/**'
      - 'Packages/**'
      - 'pubspec.yaml'
      - 'tool/**'

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/build-module.yaml

  build:
    needs: module
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: ./.github/actions/setup-frontend
        with:
          rust-workspace: Launcher/rust

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Generate Dart sources
        run: |
          dart run melos run generate_proto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run melos run generate

      - name: Generate Rust bridge
        working-directory: Launcher
        run: flutter_rust_bridge_codegen generate --no-dart-fix --no-build-runner

      - name: Generate local FFI bindings
        working-directory: Launcher
        run: dart run tool/ffigen.dart

      - uses: actions/download-artifact@v8
        with:
          name: outpost-module-windows-x64
          path: Module/bazel-bin

      - name: Check local runtime and network policy
        run: |
          cargo test --manifest-path Packages/kyber_runtime/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart tool/verify_lan_network.dart

      - name: Build portable launcher
        run: ./tool/build_launcher_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: outpost-launcher-windows-x64
          path: Launcher/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outpost-launcher-logs
          path: Launcher/build/logs/
          if-no-files-found: ignore
          retention-days: 7
