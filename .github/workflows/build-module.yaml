name: Build Outpost module

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: 1.25.0
          module-root: Module
          output-base: C:/bz
          bazelisk-cache: true
          disk-cache: outpost-module-windows
          repository-cache: true

      - name: Build module
        working-directory: Module
        run: |
          bazel build --config=release //:Kyber --jobs=4 2>&1 | Tee-Object -FilePath build-module.log
          exit $LASTEXITCODE

      - name: Package module
        run: |
          $package = 'Module/build/outpost-module'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath 'Module/bazel-bin/Kyber.dll' -Destination $package
          Copy-Item -LiteralPath 'LICENSE' -Destination $package

      - uses: actions/upload-artifact@v7
        with:
          name: outpost-module-windows-x64
          path: Module/build/outpost-module/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outpost-module-log
          path: Module/build-module.log
          if-no-files-found: ignore
          retention-days: 7
